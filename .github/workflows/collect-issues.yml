name: 이슈 자동 수집

on:
  schedule:
    - cron: "7,37 * * * *"   # 30분마다 새 분석 확인
  workflow_dispatch:
    inputs:
      force:
        description: "이미 수집한 분석도 다시 수집"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - scripts/collect-issues.mjs
      - .github/workflows/collect-issues.yml

permissions:
  contents: write
  pages: write

concurrency:
  group: collect-issues
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 새 분석의 이슈 수집
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FORCE: ${{ inputs.force && '1' || '' }}
        run: node scripts/collect-issues.mjs
      - name: 변경 시 반영
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/build-public.mjs
          if git diff --quiet -- web/insights.json docs/insights.json; then
            echo "변경 없음"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/insights.json docs/insights.json
          git commit -m "이슈 자동 수집 결과 반영"
          git push
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "Pages 재빌드 요청 실패(다음 푸시 때 반영)"
